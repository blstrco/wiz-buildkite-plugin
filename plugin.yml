name: Wiz Security Scanner
description: Integrates wiz security scanning for infrastructure-as-code and docker images
author: https://github.com/blstrco
requirements:
  - docker
configuration:
  properties:
    image-address:
      type: string
    image-env:
      type: string
    path:
      type: string
    scan-type:
      type: string
      enum:
        - docker
        - iac
    project:
      type: string
    annotate-success:
      type: boolean
    disabled-scanners:
      type: string
    scan-interval-hours:
      type: integer
      minimum: 1
  additionalProperties: false
